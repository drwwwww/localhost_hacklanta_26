# Render blueprint for the public demo (https://render.com/docs/blueprint-spec).
# The app needs only what is committed: the code, models/model.joblib, the challenge set
# and models/gap_deployed.json. Nothing is trained or downloaded on the server.
services:
  - type: web
    name: bogusai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
